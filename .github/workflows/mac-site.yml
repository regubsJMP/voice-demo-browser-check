name: mac-site
# First visit of the demo site in real Safari and Chrome on a fresh macOS VM (see site.sh). Manual start only. The site address and the
# login are repository secrets; screenshots are uploaded only as an encrypted archive.
on:
  workflow_dispatch:
    inputs:
      preview:
        description: 'Cloudflare version preview prefix (8 hex): test that version before it goes live; empty: the live site'
        required: false
        default: ''
jobs:
  site:
    strategy:
      fail-fast: false
      matrix:
        browser: [safari, chrome]
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Tools (cliclick, BlackHole virtual microphone, OCR click helper)
        run: |
          brew install cliclick || echo "cliclick install failed"
          brew install --cask blackhole-2ch || echo "BlackHole install failed"
          sudo killall coreaudiod || true
          swiftc -O clicktext.swift -o clicktext
      - name: Site, first visit
        timeout-minutes: 10
        env:
          SITE_URL_LIVE: ${{ secrets.SITE_URL }}
          PREVIEW: ${{ inputs.preview }}
          DEMO_USER: ${{ secrets.DEMO_USER }}
          DEMO_PASS: ${{ secrets.DEMO_PASS }}
        run: |
          # preview: the address is built from the secret here and masked — the public log never shows it
          if [ -n "$PREVIEW" ]; then case "$PREVIEW" in *[!0-9a-f]*) echo "preview must be hex"; exit 1;; esac
            h="${SITE_URL_LIVE#*//}"; SITE_URL="https://${PREVIEW}-${h}"; echo "site: preview version"
          else SITE_URL="$SITE_URL_LIVE"; echo "site: live"; fi
          echo "::add-mask::$SITE_URL"; export SITE_URL
          bash site.sh ${{ matrix.browser }}
      - name: Encrypt screenshots
        if: always()
        env:
          ARTIFACT_PASS: ${{ secrets.ARTIFACT_PASS }}
        run: |
          openssl version
          tar czf - out | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_PASS -out shots-${{ matrix.browser }}.enc \
            && echo "kdf: pbkdf2 200000" \
            || { tar czf - out | openssl enc -aes-256-cbc -md sha256 -salt -pass env:ARTIFACT_PASS -out shots-${{ matrix.browser }}.enc && echo "kdf: md sha256"; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-${{ matrix.browser }}
          path: shots-${{ matrix.browser }}.enc
